<!-- もとぶ会 ポイント管理（スタッフ用・スマホで開く） -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>もとぶ会 ポイント管理</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@700&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#f2f0ed; --bg2:#ffffff; --ink:#2b2624; --ink2:#6b625d; --line:#dcd6cc;
  --gold:#a1862a; --red:#af1d12; --card:#1d1a18; --card-ink:#f2ede2; --card-dim:#a89f8f;
  --ok:#2f7d4f; --err:#af1d12;
  --mincho:"Shippori Mincho","Hiragino Mincho ProN",serif;
  --sans:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#161311; --bg2:#211d1a; --ink:#f0eae0; --ink2:#a89f8f; --line:#3a332e; --gold:#c9ad4f; --red:#d9483b; --ok:#5fbf85; --err:#e0654a; }
}
:root[data-theme="dark"]{ --bg:#161311; --bg2:#211d1a; --ink:#f0eae0; --ink2:#a89f8f; --line:#3a332e; --gold:#c9ad4f; --red:#d9483b; --ok:#5fbf85; --err:#e0654a; }
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:560px;margin-inline:auto;padding:0 1rem 4rem}
header{text-align:center;padding:1.3rem 1rem .9rem;border-bottom:1px solid var(--line)}
header .mark{font-family:var(--mincho);font-size:1.15rem;letter-spacing:.3em;margin:0;font-weight:700}
header .sub{font-size:.66rem;letter-spacing:.2em;color:var(--gold);margin:.15rem 0 0;font-weight:500}
.state{display:none}.state.on{display:block}
.pin-wrap{text-align:center;padding:3rem 1rem}
.pin-wrap p{color:var(--ink2);font-size:.88rem;margin-bottom:1.3rem}
input,select,textarea{width:100%;padding:.85rem .9rem;font-size:16px;background:var(--bg2);border:1px solid var(--line);color:var(--ink);font-family:var(--sans);border-radius:4px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold)}
.pin-wrap input{text-align:center;letter-spacing:.5em;font-size:1.3rem}
button{width:100%;padding:.95rem;font-size:.95rem;font-weight:700;letter-spacing:.12em;background:var(--red);color:#fff;border:none;cursor:pointer;font-family:var(--sans);border-radius:4px;margin-top:.8rem}
button:disabled{opacity:.45}
button.sub{background:transparent;color:var(--ink2);border:1px solid var(--line);font-weight:400}
.search{padding:.9rem 0 .6rem;position:sticky;top:0;background:var(--bg);z-index:5}
.tabs{display:flex;gap:.4rem;margin-bottom:.7rem}
.tabs button{flex:1;margin:0;padding:.6rem .2rem;font-size:.8rem;background:var(--bg2);color:var(--ink2);border:1px solid var(--line);font-weight:600}
.tabs button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.filters{display:flex;gap:.4rem;margin-top:.5rem}
.filters button{flex:1;margin:0;padding:.45rem .2rem;font-size:.72rem;background:transparent;color:var(--ink2);border:1px solid var(--line);font-weight:500;letter-spacing:0}
.filters button.on{color:var(--gold);border-color:var(--gold)}
.mlist{display:grid;gap:.4rem}
.m{background:var(--bg2);border:1px solid var(--line);border-radius:6px;padding:.7rem .9rem;display:grid;grid-template-columns:2.6rem 1fr auto;gap:.6rem;align-items:center;cursor:pointer}
.m:active{border-color:var(--gold)}
.m .g{font-family:"Bodoni Moda","Didot",serif;font-weight:700;color:var(--gold);font-size:1.1rem;text-align:center;line-height:1.1}
.m .g.owner{font-family:var(--mincho);font-size:.62rem;letter-spacing:0}
.m .nm{font-weight:600;font-size:.95rem}
.m .sh{color:var(--ink2);font-size:.72rem}
.m .pt{font-size:1.15rem;font-weight:700;white-space:nowrap;text-align:right;font-variant-numeric:tabular-nums;line-height:1.2}
.m .pt small{font-size:.62rem;color:var(--ink2);font-weight:400;margin-left:.15rem}
.m .pt .v{display:block;font-size:.68rem;color:var(--ink2);font-weight:400}
.m.bday .nm::after{content:"誕生月";font-size:.6rem;background:var(--red);color:#fff;padding:.05rem .4rem;margin-left:.4rem;font-weight:500;border-radius:2px}
.m.unlinked{opacity:.55}
.empty{text-align:center;color:var(--ink2);font-size:.85rem;padding:2rem 1rem}
.card{background:var(--card);color:var(--card-ink);border-radius:8px;padding:1rem 1.1rem;margin:1rem 0}
.card .who{font-size:1.05rem;font-weight:600;margin:0}
.card .who small{display:block;color:var(--card-dim);font-size:.76rem;font-weight:400;margin-top:.15rem}
.card .now{display:flex;gap:1.4rem;margin-top:.6rem}
.card .now div{font-size:1.5rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.card .now small{display:block;font-size:.62rem;color:var(--card-dim);font-weight:400;letter-spacing:.12em;margin-bottom:.15rem}
.card .ready{margin:.7rem 0 0;font-size:.74rem;color:var(--gold)}
label{display:block;font-size:.8rem;font-weight:700;margin:1.1rem 0 .35rem;letter-spacing:.04em}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:.4rem;margin-top:.4rem}
.grid button{margin:0;padding:.75rem .4rem;font-size:.84rem;background:var(--bg2);color:var(--ink);border:1px solid var(--line);font-weight:500;letter-spacing:0;text-align:left;line-height:1.35}
.grid button b{display:block;font-size:1rem;font-weight:700}
.grid button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid button.on b{color:var(--gold)}
.grid button.minus.on{background:var(--red);border-color:var(--red)}
.grid button.minus.on b{color:#fff}
.grid button.dis{opacity:.4;pointer-events:none}
.msg{padding:.8rem 1rem;font-size:.86rem;margin:1rem 0;display:none;border-radius:4px}
.msg.on{display:block}
.msg.ok{background:rgba(47,125,79,.12);border-left:3px solid var(--ok);color:var(--ok)}
.msg.err{background:rgba(175,29,18,.1);border-left:3px solid var(--err);color:var(--err)}
.hist{display:grid;gap:.3rem;margin-top:.6rem}
.h{background:var(--bg2);border:1px solid var(--line);border-radius:6px;padding:.55rem .8rem;display:grid;grid-template-columns:1fr auto;gap:.5rem;font-size:.8rem}
.h .d{color:var(--ink2);font-size:.7rem}
.h .a{font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.h .a.plus{color:var(--ok)}.h .a.minus{color:var(--err)}
.spinner{width:30px;height:30px;border:2px solid var(--line);border-top-color:var(--gold);border-radius:50%;margin:2rem auto;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.spinner{animation:none}}
.castnote{font-size:.8rem;color:var(--ink2);line-height:1.8;margin:4px 0 12px}
.castnote b{color:var(--ink)}
#castText{resize:vertical;line-height:1.7}
.foot{color:var(--ink2);font-size:.74rem;text-align:center;margin-top:.8rem}
</style>

<header><p class="mark">もとぶ会</p><p class="sub">POINT ADMIN ｜ 那覇店</p></header>
<div class="wrap">

<div class="state on" id="s-pin">
  <div class="pin-wrap">
    <p>暗証番号を入力してください</p>
    <input type="tel" id="pin" inputmode="numeric" maxlength="8" placeholder="････">
    <div class="msg err" id="pinErr">暗証番号が違います</div>
    <button id="btnPin">開　く</button>
  </div>
</div>

<div class="state" id="s-list">
  <div class="search">
    <div class="tabs">
      <button class="on" data-t="members">会員から選ぶ</button>
      <button data-t="history">最近の履歴</button>
      <button data-t="cast">配信</button>
    </div>
    <input type="text" id="q" placeholder="お名前・会員番号で絞り込み" autocomplete="off">
    <div class="filters" id="filters">
      <button class="on" data-f="all">すべて</button>
      <button data-f="bday">今月が誕生月</button>
      <button data-f="ready">特典交換できる</button>
      <button data-f="naha">那覇市内</button>
      <button data-f="store">那覇店会員</button>
    </div>
  </div>
  <div id="listArea"><div class="spinner"></div></div>
  <div id="histArea" style="display:none"><div class="spinner"></div></div>
  <div id="castArea" style="display:none">
    <label>送る相手</label>
    <select id="castArea_sel">
      <option value="all">登録会員 全員</option>
      <option value="県内">沖縄県内の方（那覇市内を含む）</option>
      <option value="那覇市内">那覇市内の方のみ</option>
    </select>
    <p class="castnote" style="margin-top:.6rem"><b id="castCount">—</b> 名に送信します。友だち追加していない方には届きません。1名につき配信数1通を消費します。</p>
    <textarea id="castText" rows="9" placeholder="送信する本文を入力&#10;（1000文字まで）"></textarea>
    <button type="button" id="castBtn">この内容で送信する</button>
    <div class="msg" id="castMsg"></div>
  </div>
</div>

<div class="state" id="s-give">
  <button class="sub" id="btnBack" style="margin:1rem 0 0">← 一覧にもどる</button>
  <div class="card">
    <p class="who" id="g-name">—<small id="g-sub">—</small></p>
    <div class="now">
      <div><small>POINT</small><span id="g-pt">0</span></div>
      <div><small>来店</small><span id="g-visits">0</span></div>
      <div><small>RANK</small><span id="g-rank">A3</span></div>
    </div>
    <p class="ready" id="g-ready"></p>
  </div>

  <label>貯める</label>
  <div class="grid" id="earn">
    <button data-v="1" data-r="ご来店"><b>+1P</b>ご来店</button>
    <button data-v="2" data-r="ご来店（1万円以上）"><b>+2P</b>ご来店（お会計1万円以上）</button>
  </div>

  <label>特典と交換する（ポイントを差し引く）</label>
  <div class="grid" id="use"></div>

  <label>その他</label>
  <div class="grid" id="other">
    <button data-v="0" data-r=""><b>手入力</b>付与漏れ・調整など</button>
  </div>
  <input type="number" id="amount" placeholder="ポイント数（減らすときはマイナス）" style="margin-top:.5rem;display:none">
  <input type="text" id="reason" placeholder="理由を入力" style="margin-top:.5rem;display:none">

  <div class="msg" id="giveMsg"></div>
  <button id="btnGive">この内容で登録する</button>
  <p class="foot">登録すると、ご本人のLINEに自動で通知が届きます</p>
</div>

</div>

<script>
const GAS_URL = 'https://script.google.com/macros/s/AKfycbyrJZpUwgBXEFvh3DQXdZ22gm6d7AgugFT1utilMVCvkSzA4ufRNRC0D_rTiC27CzW2Dg/exec';

const $ = id => document.getElementById(id);
const show = id => { document.querySelectorAll('.state').forEach(e => e.classList.remove('on')); $(id).classList.add('on'); };
let PIN = localStorage.getItem('motobukai_pin') || '';
let members = [], REWARDS = [], target = null, amount = null, reason = null, filter = 'all';
const thisMonth = new Date().getMonth() + 1;

$('btnPin').onclick = () => tryPin($('pin').value.trim());
$('pin').addEventListener('keydown', e => { if (e.key === 'Enter') $('btnPin').click(); });
async function tryPin(pin) {
  if (!pin) return;
  $('btnPin').disabled = true;
  const r = await api(`admin_members&pin=${encodeURIComponent(pin)}`);
  $('btnPin').disabled = false;
  if (!r.ok) { $('pinErr').classList.add('on'); return; }
  PIN = pin; localStorage.setItem('motobukai_pin', pin);
  members = r.members; REWARDS = r.rewards || [];
  renderUse(); renderList(); show('s-list');
}
if (PIN) tryPin(PIN);

function renderList() {
  const q = $('q').value.trim().toLowerCase();
  const hit = members.filter(m => {
    if (q && !((m.name || '').toLowerCase().includes(q) || (m.id || '').toLowerCase().includes(q))) return false;
    if (filter === 'bday') return Number(m.birth) === thisMonth;
    if (filter === 'ready') return REWARDS.length && m.points >= REWARDS[0].pt;
    if (filter === 'naha') return m.area === '那覇市内';
    if (filter === 'store') return (m.store || '那覇店') === '那覇店';
    return true;
  });
  if (!hit.length) { $('listArea').innerHTML = '<div class="empty">該当する会員がいません</div>'; return; }
  $('listArea').innerHTML = '<div class="mlist">' + hit.map(m =>
    `<div class="m${m.linked ? '' : ' unlinked'}${Number(m.birth) === thisMonth ? ' bday' : ''}" data-i="${members.indexOf(m)}">
       <div class="g${m.rank.length > 2 ? ' owner' : ''}">${esc(m.rank)}</div>
       <div><div class="nm">${esc(m.name)}</div><div class="sh">${esc(m.id)}　${esc(m.store || '')}　${esc(m.area || '')}${m.last ? '　最終来店 ' + esc(m.last) : ''}</div></div>
       <div class="pt">${m.points}<small>P</small><span class="v">来店 ${m.visits}回</span></div>
     </div>`).join('') + '</div>';
  document.querySelectorAll('.m').forEach(el => { el.onclick = () => openGive(members[Number(el.dataset.i)]); });
}
$('q').addEventListener('input', renderList);
document.querySelectorAll('#filters button').forEach(b => {
  b.onclick = () => { document.querySelectorAll('#filters button').forEach(x => x.classList.remove('on')); b.classList.add('on'); filter = b.dataset.f; renderList(); };
});

document.querySelectorAll('.tabs button').forEach(b => {
  b.onclick = async () => {
    document.querySelectorAll('.tabs button').forEach(x => x.classList.remove('on')); b.classList.add('on');
    const t = b.dataset.t, isHist = t === 'history', isCast = t === 'cast';
    $('listArea').style.display = (isHist || isCast) ? 'none' : 'block';
    $('histArea').style.display = isHist ? 'block' : 'none';
    $('castArea').style.display = isCast ? 'block' : 'none';
    $('q').style.display = (isHist || isCast) ? 'none' : 'block';
    $('filters').style.display = (isHist || isCast) ? 'none' : 'flex';
    if (isCast) { updateCastCount(); return; }
    if (isHist) {
      $('histArea').innerHTML = '<div class="spinner"></div>';
      const r = await api(`admin_history&pin=${encodeURIComponent(PIN)}`);
      if (!r.ok) { $('histArea').innerHTML = '<div class="empty">読み込めませんでした</div>'; return; }
      if (!r.history.length) { $('histArea').innerHTML = '<div class="empty">まだ履歴がありません</div>'; return; }
      $('histArea').innerHTML = '<div class="hist">' + r.history.map(h =>
        `<div class="h"><div><div>${esc(h.name)}　<span style="color:var(--ink2)">${esc(h.reason)}</span></div>
           <div class="d">${esc(h.date)}　残高 ${h.total}P</div></div>
           <div class="a ${h.amount >= 0 ? 'plus' : 'minus'}">${h.amount >= 0 ? '+' : ''}${h.amount}P</div></div>`).join('') + '</div>';
    }
  };
});

function renderUse() {
  $('use').innerHTML = REWARDS.map(r => `<button class="minus" data-v="${-r.pt}" data-r="特典利用：${esc(r.name)}"><b>−${r.pt}P</b>${esc(r.name)}</button>`).join('');
  bindChoice();
}
function bindChoice() {
  document.querySelectorAll('#earn button,#use button,#other button').forEach(b => {
    b.onclick = () => {
      document.querySelectorAll('#earn button,#use button,#other button').forEach(x => x.classList.remove('on'));
      b.classList.add('on');
      const v = Number(b.dataset.v);
      if (v === 0) { $('amount').style.display = 'block'; $('reason').style.display = 'block'; amount = null; reason = null; $('amount').focus(); }
      else { $('amount').style.display = 'none'; $('reason').style.display = 'none'; amount = v; reason = b.dataset.r; }
    };
  });
}
bindChoice();

function openGive(m) {
  target = m; amount = null; reason = null;
  $('g-name').firstChild.textContent = m.name;
  $('g-sub').textContent = `${m.id}　${m.area || ''}${Number(m.birth) === thisMonth ? '　★今月が誕生月（もとぶ牛1皿）' : ''}${m.expiry ? '　／　有効期限 ' + m.expiry : ''}`;
  $('g-pt').textContent = m.points; $('g-visits').textContent = m.visits; $('g-rank').textContent = m.rank;
  const ready = REWARDS.filter(r => m.points >= r.pt);
  $('g-ready').textContent = ready.length ? '交換できる特典：' + ready.map(r => r.pt + 'P ' + r.name).join(' ／ ') : '';
  document.querySelectorAll('#use button').forEach(b => b.classList.toggle('dis', m.points < -Number(b.dataset.v)));
  document.querySelectorAll('#earn button,#use button,#other button').forEach(b => b.classList.remove('on'));
  $('amount').style.display = 'none'; $('amount').value = '';
  $('reason').style.display = 'none'; $('reason').value = '';
  $('giveMsg').className = 'msg';
  show('s-give'); window.scrollTo(0, 0);
}
$('btnBack').onclick = () => { show('s-list'); renderList(); };

$('btnGive').onclick = async () => {
  const amt = amount !== null ? amount : Number($('amount').value);
  const rsn = reason !== null ? reason : $('reason').value.trim();
  if (!amt) { msg('err', '内容を選んでください'); return; }
  if (!rsn) { msg('err', '理由を入力してください'); return; }
  $('btnGive').disabled = true; msg('', '');
  try {
    const res = await fetch(GAS_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'admin_point', pin: PIN, memberId: target.id, amount: amt, reason: rsn }) });
    const d = await res.json();
    if (!d.ok) throw new Error(d.error || '失敗しました');
    const rankUp = d.rank !== target.rank;
    target.points = d.points; target.visits = d.visits; target.rank = d.rank;
    $('g-pt').textContent = d.points; $('g-visits').textContent = d.visits; $('g-rank').textContent = d.rank;
    document.querySelectorAll('#use button').forEach(b => b.classList.toggle('dis', d.points < -Number(b.dataset.v)));
    msg('ok', `${d.name} 様：${amt > 0 ? '+' : ''}${amt}P（残高 ${d.points}P・来店 ${d.visits}回）${rankUp ? '　★ ' + d.rank + ' にランクアップ！' : ''}`);
    document.querySelectorAll('#earn button,#use button,#other button').forEach(b => b.classList.remove('on'));
    amount = null; reason = null; $('amount').value = ''; $('reason').value = '';
  } catch (e) { msg('err', '登録できませんでした：' + e.message); }
  $('btnGive').disabled = false;
};
function msg(type, text) { const el = $('giveMsg'); el.className = 'msg' + (type ? ` ${type} on` : ''); el.textContent = text; }

function updateCastCount() {
  const a = $('castArea_sel').value;
  $('castCount').textContent = members.filter(m => m.linked && (a === 'all' || (a === '那覇市内' ? m.area === '那覇市内' : (m.area === '那覇市内' || m.area === '沖縄県内')))).length;
}
$('castArea_sel').onchange = updateCastCount;
$('castBtn').onclick = async () => {
  const text = $('castText').value.trim(), n = $('castCount').textContent, el = $('castMsg');
  el.className = 'msg'; el.textContent = '';
  if (!text) { el.className = 'msg err on'; el.textContent = '本文を入力してください。'; return; }
  if (!confirm(`${n}名に送信します。よろしいですか？\n\n※取り消しはできません`)) return;
  $('castBtn').disabled = true; $('castBtn').textContent = '送信中…';
  try {
    const res = await fetch(GAS_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'admin_broadcast', pin: PIN, text, area: $('castArea_sel').value }) });
    const d = await res.json();
    if (!d.ok) throw new Error(d.error || '失敗しました');
    el.className = 'msg ok on'; el.textContent = `${d.sent}名に送信しました。`; $('castText').value = '';
  } catch (e) { el.className = 'msg err on'; el.textContent = '送信できませんでした：' + e.message; }
  $('castBtn').disabled = false; $('castBtn').textContent = 'この内容で送信する';
};

async function api(q) { try { const r = await fetch(`${GAS_URL}?action=${q}`); return await r.json(); } catch (e) { return { ok: false, error: '通信エラー' }; } }
function esc(s) { return String(s || '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
</script>
